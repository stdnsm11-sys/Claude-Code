<title>Visual Learning Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: teacher console (nav + two-column work area) and a full-bleed student board for the Smartboard. */
:root {
  --bg: #F1F5FB; --surface: #FFFFFF; --surface-2: #E6EDF8; --ink: #13213C; --muted: #52607A; --line: #C9D4E6;
  --primary: #1F5FBF; --primary-ink: #FFFFFF; --primary-soft: #DCE8FB;
  --sun: #F2B705; --sun-soft: #FFF3C7; --sun-ink: #13213C;
  --teal: #0C7E73; --teal-soft: #D5F1EC;
  --coral: #D24A33; --coral-soft: #FCE3DD;
  --good: #1B7F45; --good-soft: #DAF2E3; --warn: #9A6200; --bad: #C2412D;
  --f-display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px; --r-sm: 9px;
  --shadow: 0 1px 2px rgb(19 33 60 / .06), 0 4px 14px rgb(19 33 60 / .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1525; --surface: #152038; --surface-2: #1D2A47; --ink: #EAF0FA; --muted: #A1AEC6; --line: #2D3B5B;
  --primary: #79A9FF; --primary-ink: #0D1525; --primary-soft: #1F3360;
  --sun: #FFC933; --sun-soft: #3A3317; --sun-ink: #13213C;
  --teal: #45C6B6; --teal-soft: #143C3A; --coral: #FF7D66; --coral-soft: #44221D;
  --good: #57CF88; --good-soft: #163A27; --warn: #F0B23A; --bad: #FF7D66;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 14px rgb(0 0 0 / .25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1525; --surface: #152038; --surface-2: #1D2A47; --ink: #EAF0FA; --muted: #A1AEC6; --line: #2D3B5B;
  --primary: #79A9FF; --primary-ink: #0D1525; --primary-soft: #1F3360;
  --sun: #FFC933; --sun-soft: #3A3317; --sun-ink: #13213C;
  --teal: #45C6B6; --teal-soft: #143C3A; --coral: #FF7D66; --coral-soft: #44221D;
  --good: #57CF88; --good-soft: #163A27; --warn: #F0B23A; --bad: #FF7D66;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 14px rgb(0 0 0 / .25); color-scheme: dark }

html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.1rem; } h4 { font-size: .95rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; margin-right: auto; }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--sun); color: var(--sun-ink); display: grid; place-items: center; }
.nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
.nav a { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 700; white-space: nowrap; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--primary); color: var(--primary-ink); }
.chipsel { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
.chipsel select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--good); } .dot.wait { background: var(--warn); } .dot.off { background: var(--bad); }

main { padding-block: 20px 60px; max-width: 1280px; margin: 0 auto; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
.eyebrow { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); } .small { font-size: .88rem; }
.notice { padding: 12px 14px; border-radius: var(--r-sm); background: var(--sun-soft); border: 1px solid var(--sun); font-size: .92rem; }
.notice.err { background: var(--coral-soft); border-color: var(--coral); }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 9px 16px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sun { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { min-height: 36px; padding: 6px 11px; font-size: .88rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.ico { display: inline-flex; width: 1.2em; height: 1.2em; flex: none; }
.ico svg { width: 100%; height: 100%; }
label.field { display: flex; flex-direction: column; gap: 5px; font-weight: 700; font-size: .9rem; min-width: 0; }
input[type=text], input[type=date], input[type=number], select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 400; }
textarea { min-height: 84px; resize: vertical; }
.search { display: flex; gap: 8px; }
.search input { font-size: 1.1rem; padding: 12px 14px; }
.slider-wrap { display: grid; gap: 6px; }
input[type=range] { width: 100%; accent-color: var(--primary); height: 32px; }
.ticks { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.level-pill { font-family: var(--f-display); background: var(--primary-soft); color: var(--primary); padding: 3px 12px; border-radius: 999px; font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 8px 13px; min-height: 40px; font-weight: 700; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .15s; }
.switch input:checked + span { background: var(--good); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--sun); outline-offset: 2px; }
.kind { font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }

/* Passage preview */
.sent { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 12px; align-items: center; padding: 10px; border-radius: var(--r-sm); }
.sent + .sent { border-top: 1px dashed var(--line); }
.sent .pic { font-size: 2rem; text-align: center; line-height: 1; }
.sent.on { background: var(--sun-soft); }
.sent p { font-size: 1.12rem; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.key { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; background: var(--surface-2); min-width: 0; }
.key b { display: block; font-family: var(--f-display); font-size: .82rem; color: var(--primary); text-transform: uppercase; letter-spacing: .05em; }
.vocab { display: flex; gap: 10px; flex-wrap: wrap; }
.vocab div { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 12px; background: var(--surface); }
.lib { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
.lib button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.lib button:hover { background: var(--surface-2); }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
.steps button { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 4px; cursor: pointer; font-weight: 700; font-size: .82rem; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.steps button[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }
.steps .ico { width: 1.5em; height: 1.5em; }
.counter { display: flex; align-items: center; gap: 10px; }
.counter output { font-family: var(--f-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: center; }
.acc-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 0; }
.acc-row + .acc-row { border-top: 1px solid var(--line); }
.acc-row p { font-size: .9rem; color: var(--muted); }
.goal-text { font-size: .92rem; color: var(--muted); border-left: 3px solid var(--sun); padding-left: 10px; }

/* Data */
.check-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 6px 0; }
.big-check { width: 28px; height: 28px; accent-color: var(--good); }
.score { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 14px; border-radius: var(--r-sm); background: var(--surface-2); }
.score .num { font-family: var(--f-display); font-size: 2.2rem; font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: .82rem; }
.badge.met { background: var(--good-soft); color: var(--good); }
.badge.not { background: var(--coral-soft); color: var(--bad); }
.pm { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.pm button { border: 0; min-width: 48px; min-height: 42px; background: var(--surface); font-weight: 700; cursor: pointer; font-size: 1.05rem; }
.pm button + button { border-left: 1px solid var(--line); }
.pm button[aria-pressed="true"].plus { background: var(--good); color: var(--surface); }
.pm button[aria-pressed="true"].minus { background: var(--bad); color: var(--surface); }
.pm button[aria-pressed="true"].na { background: var(--muted); color: var(--surface); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.stat b { display: block; font-family: var(--f-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .target { stroke: var(--sun); stroke-width: 2; stroke-dasharray: 6 5; }
.chart .line { stroke: var(--primary); stroke-width: 2.5; fill: none; }
.chart .area { fill: var(--primary-soft); opacity: .7; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .pt-met { fill: var(--good); stroke: var(--surface); stroke-width: 2; }
.chart .pt-not { fill: var(--coral); stroke: var(--surface); stroke-width: 2; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.num { font-variant-numeric: tabular-nums; }
.detail { background: var(--surface-2); }
.detail ul { margin: 4px 0; padding-left: 20px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 700; z-index: 30; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.alert { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 31; background: var(--coral); color: #fff; border-radius: 14px; padding: 14px 16px; max-width: min(380px, calc(100% - 24px)); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.alert .btn { min-height: 38px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--coral-soft); padding: 8px 10px; border-radius: 10px; }
.list-ed { display: flex; flex-direction: column; gap: 8px; }
.acc-ed { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1.6fr) auto; gap: 8px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
@media (max-width: 700px) { .acc-ed { grid-template-columns: minmax(0,1fr); } }
.note-out { white-space: pre-wrap; background: var(--surface-2); border-radius: 10px; padding: 12px; }

/* ===== Student board ===== */
.board { min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; font-size: clamp(18px, 1.6vw + 8px, 30px); }
.board-top { display: flex; align-items: center; gap: 12px; padding-block: 12px; flex-wrap: wrap; }
.board-title { font-family: var(--f-display); font-size: 1.3em; font-weight: 700; margin-right: auto; }
.bsteps { display: flex; gap: 8px; flex-wrap: wrap; }
.bsteps button { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: .35em .8em; font-family: var(--f-display); font-weight: 600; font-size: .8em; cursor: pointer; display: inline-flex; gap: .4em; align-items: center; color: var(--muted); }
.bsteps button[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }
.board-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .36fr); gap: 20px; padding-block: 8px 24px; align-items: start; }
@media (max-width: 900px) { .board-body { grid-template-columns: minmax(0,1fr); } }
.stage { background: var(--surface); border-radius: 22px; padding: 1.1em; border: 2px solid var(--line); min-width: 0; display: flex; flex-direction: column; gap: .8em; }
.stage h2 { font-size: 1.4em; }
.bsent { display: grid; grid-template-columns: 2.6em minmax(0,1fr); gap: .6em; align-items: center; padding: .5em .6em; border-radius: 16px; background: var(--surface-2); }
.bsent .pic { font-size: 2em; line-height: 1; text-align: center; }
.bsent p { font-size: 1.15em; line-height: 1.4; }
.bsent.new { outline: 4px solid var(--sun); }
.bsent.hidden-text p { color: transparent; text-shadow: none; background: repeating-linear-gradient(90deg, var(--line) 0 1.2em, transparent 1.2em 1.5em); border-radius: 6px; user-select: none; }
.borg { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9em), 1fr)); gap: .6em; }
.borg button { border: 3px dashed var(--primary); border-radius: 18px; background: var(--surface); padding: .6em; min-height: 5.2em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2em; cursor: pointer; text-align: center; }
.borg button b { font-family: var(--f-display); color: var(--primary); font-size: .95em; }
.borg button .e { font-size: 1.7em; line-height: 1; }
.borg button.shown { border-style: solid; background: var(--primary-soft); }
.borg button span.a { font-size: .9em; }
.frame { font-size: 1.3em; font-family: var(--f-display); background: var(--sun-soft); border: 3px solid var(--sun); border-radius: 18px; padding: .6em .8em; }
.bigpics { display: flex; gap: .5em; flex-wrap: wrap; justify-content: center; font-size: 3em; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.anchor { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: .6em .7em; display: grid; grid-template-columns: 2em minmax(0,1fr); gap: .5em; align-items: center; }
.anchor .ico { width: 2em; height: 2em; color: var(--teal); }
.anchor b { font-family: var(--f-display); display: block; font-size: .9em; }
.anchor span { font-size: .72em; color: var(--muted); }
.anchor.hot { border-color: var(--teal); background: var(--teal-soft); }
.cuecard { background: var(--primary-soft); border: 2px solid var(--primary); border-radius: 18px; padding: .6em .8em; font-size: .8em; display: flex; gap: .6em; align-items: center; }
.cuecard .ico { width: 1.8em; height: 1.8em; color: var(--primary); }
.cant-hear { border: 0; background: var(--coral); color: #fff; border-radius: 22px; padding: .6em .8em; font-family: var(--f-display); font-weight: 700; font-size: 1em; cursor: pointer; display: flex; align-items: center; gap: .5em; justify-content: center; box-shadow: var(--shadow); }
.cant-hear .ico { width: 1.7em; height: 1.7em; }
.cant-hear small { display: block; font-family: var(--f-body); font-weight: 400; font-size: .62em; opacity: .95; }
.ticklist { display: flex; flex-direction: column; gap: .45em; }
.ticklist button { display: grid; grid-template-columns: 1.6em minmax(0,1fr) 1.4em; gap: .5em; align-items: center; text-align: left; border: 2px solid var(--line); border-radius: 14px; padding: .45em .6em; background: var(--surface); cursor: pointer; font-size: .95em; }
.ticklist button .e { font-size: 1.3em; }
.ticklist button.done { background: var(--good-soft); border-color: var(--good); }
.ticklist .tick { width: 1.3em; height: 1.3em; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.ticklist button.done .tick { background: var(--good); border-color: var(--good); color: var(--surface); }
.trouble { counter-reset: t; display: flex; flex-direction: column; gap: .35em; margin: 0; padding: 0; list-style: none; font-size: .85em; }
.trouble li { display: grid; grid-template-columns: 1.6em minmax(0,1fr); gap: .4em; align-items: start; }
.trouble li::before { counter-increment: t; content: counter(t); width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--teal); color: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: .85em; }
.vocab-b { display: flex; gap: .5em; flex-wrap: wrap; }
.vocab-b div { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: .3em .6em; font-size: .8em; }
.board-ctl { display: flex; gap: 10px; flex-wrap: wrap; }
.board-ctl .btn { font-size: .7em; min-height: 2.4em; }
.got-it { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / .45); z-index: 40; }
.got-it div { background: var(--surface); border-radius: 26px; padding: 1.2em 1.6em; font-family: var(--f-display); font-size: 1.6em; text-align: center; border: 4px solid var(--good); }
@media (prefers-reduced-motion: no-preference) { .bsent.new { animation: pop .4s ease-out; } @keyframes pop { from { transform: scale(.97); opacity: .4 } to { transform: none; opacity: 1 } } }
</style>

<div id="app"></div>

<script>
"use strict";
/* ---------- tiny DOM helper ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = true;

    a.type === "recall" ? (a.elements || []).map(e => (e.recalled ? "+ " : "- ") + e.text).join("; ") : (a.items || []).map(i => `${i.result} ${i.label}`).join("; "), a.notes, a.device, a.staff].map(esc).join(",")));
  try { await S.downloads.save({ filename: `${sname().replace(/[^A-Za-z0-9]+/g, "")}-goal-data-${todayISO()}.csv`, data: lines.join("\r\n") }); }
  catch (e) { if (e?.code !== "cancelled" && e?.code !== "declined") toast("The file was not saved."); }
}
async function draftNote(g, list) {
  S.note = { busy: true, text: "", error: "" }; render();
  const rows = list.slice(0, 30).reverse().map(a => `${fmtDate(a.at)} | ${a.topic || ""} | ${a.correct}/${a.total} = ${a.pct}% | met: ${a.met ? "yes" : "no"} | reminders: ${a.reminders ?? 0} | prompt: ${a.prompt || ""} | strategies: ${(a.strategies || []).join(", ")} | accommodations: ${(a.accommodations || []).join(", ")} | notes: ${a.notes || ""}`).join("\n");
  try {
    const { text } = await S.sample(`Write a concise IEP progress-report note (4-6 sentences, plain professional language, third person, use only the student's initials "${sname()}") for this goal, based only on the data below. State the number of data points, recent average vs the ${g.target}% criterion, the trend, which supports/strategies appear linked to success, and one next step. Do not invent data.\n\nGoal: ${g.text}\n\nData (oldest to newest):\n${rows}`, { cache: false, onText: ({ text }) => { S.note.text = text; const o = $("#note-out"); if (o) o.textContent = text; else render(); } });
    S.note = { busy: false, text, error: "" };
  } catch (e) { S.note = { busy: false, text: e?.text || "", error: e?.code === "cancelled" ? "" : "Could not draft the note. Try again in a moment." }; if (e?.code === "not_granted") S.sample = null; }
  render();
}

          h("button", { class: "btn", onclick: () => addStudent(S.setup.newStudent, true) }, icon("plus"), "Add")),
        h("p", { class: "small muted", style: "margin-top:8px" }, "New students start with both goal templates. Use initials, not full names.")),
      h("section", { class: "panel" }, h("h3", { style: "margin-bottom:8px" }, "Where your data lives"),
        h("p", { class: "small" }, "Students, goals, attempts and the live lesson are saved in this page's own database on claude.ai. Every device you open this page on, signed in to your account, reads and writes the same records."),
        h("p", { class: "small muted", style: "margin-top:8px" }, "The page is private to you unless you share it. Share it with co-teachers as Contributor so they can record data too."))));
}

      d.type === "recall" && h("label", { class: "field", style: "flex:0 1 130px" }, "Min. elements", h("input", { type: "number", id: "g-min", min: 1, max: 12, value: d.minElements, oninput: e => set("minElements", +e.target.value || 1) })),
      h("label", { class: "field", style: "flex:0 1 130px" }, "Max reminders", h("input", { type: "number", id: "g-rem", min: 0, max: 10, value: d.maxReminders, oninput: e => set("maxReminders", +e.target.value || 0) }))),

        h("input", { type: "text", id: "it-l-" + i, value: it.label, style: "flex:1 1 200px;width:auto", "aria-label": "Skill", oninput: e => it.label = e.target.value }),
        h("button", { class: "btn sm ghost", "aria-label": "Remove skill", onclick: () => { d.items.splice(i, 1); render(); } }, icon("x"))))),

        h("select", { id: "a-k-" + i, "aria-label": "Type", onchange: e => a.kind = e.target.value }, Object.entries(KINDS).map(([k, l]) => h("option", { value: k, selected: a.kind === k }, l))),

function saveGoal(d) {
  if (!S.db) return toast("Saving is off in this view.");
  const { id, ...body } = d; body.items = (body.items || []).filter(i => i.label.trim()); body.accommodations = body.accommodations.filter(a => a.label.trim());
  serial("goals/" + id, () => S.db.doc("goals/" + id).set(body)).then(() => toast("Goal saved."), writeErr);
  S.setup.editGoal = null; render();
}
async function addGoal(tpl) {
  if (!S.db || !S.sid) return toast("Saving is off in this view.");
  const t = TEMPLATES[tpl](); t.text = t.text.replaceAll("{name}", sname());
  const order = Math.max(0, ...studentGoals().map(g => g.order || 0)) + 1;
  try { const ref = await S.db.collection("goals").add({ ...t, studentId: S.sid, order, createdAt: Date.now() }); S.setup.editGoal = ref.id; S.setup.draft = { id: ref.id, ...t, studentId: S.sid, order }; render(); } catch (e) { writeErr(e); }
}
async function addStudent(name, withGoals) {
  name = (name || "").trim(); if (!name) return toast("Type the student's initials.");
  if (!S.db) return toast("Saving is off in this view.");
  try {
    const ref = await S.db.collection("students").add({ name, supports: GENERAL_SUPPORTS(), createdAt: Date.now() });
    if (withGoals) {
      let o = 1;
      for (const k of ["recall", "advocacy"]) { const t = TEMPLATES[k](); t.text = t.text.replaceAll("{name}", name); await S.db.collection("goals").add({ ...t, studentId: ref.id, order: o++, createdAt: Date.now() }); }
    }
    S.setup.newStudent = ""; selectStudent(ref.id); toast(`${name} added.`);
  } catch (e) { writeErr(e); }
}

(async () => {
  const c = window.claude;
  if (!c?.use) { S.dbState = "off"; S.loaded.students = true; render(); return; }
  const [db, user, sample, downloads] = await Promise.all(["db", "user", "sample", "downloads"].map(n => c.use(n).catch(() => null)));
  S.user = user; S.sample = sample; S.downloads = downloads;
  if (user) user.can("data.write").then(v => { if (v === false) { S.canWrite = false; render(); } }).catch(() => {});
  if (!db) { S.dbState = "off"; S.loaded.students = true; render(); return; }
  S.db = db;
  const slow = setTimeout(() => { if (S.dbState === "connecting") { S.dbState = "slow"; S.loaded.students = true; render(); } }, 10000);
  const ok = snap => { if (!snap.metadata.fromCache) { clearTimeout(slow); S.dbState = "live"; } };
  db.collection("students").orderBy("createdAt").onSnapshot(snap => {
    ok(snap); S.students = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded.students = true;
    if (!S.students.find(s => s.id === S.sid) && S.students.length) { S.sid = S.students[0].id; store.set("vlh.sid", S.sid); subscribeSession(); }
    else if (S.sid && !S.sessUnsub) subscribeSession();
    render();
  }, () => { S.dbState = "off"; S.loaded.students = true; render(); });
  db.collection("goals").onSnapshot(snap => { ok(snap); S.goals = snap.docs.map(d => ({ id: d.id, ...JSON.parse(JSON.stringify(d.data())) })); render(); }, () => {});
  db.collection("attempts").orderBy("at", "desc").limit(1000).onSnapshot(snap => { S.attempts = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (S.view !== "collect") render(); }, () => {});
  db.collection("texts").orderBy("createdAt", "desc").limit(80).onSnapshot(snap => { S.texts = snap.docs.map(d => ({ id: d.id, ...JSON.parse(JSON.stringify(d.data())) })); if (S.view === "lesson") render(); }, () => {});
})();
