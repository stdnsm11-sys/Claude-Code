name: Deploy brain-viz to GitHub Pages

on:
  push:
    branches: [claude/smartboard-teaching-aid-4h1m0f]
    paths: ["brain-viz/**", ".github/workflows/deploy-brain-viz.yml"]
  pull_request:
    paths: ["brain-viz/**", ".github/workflows/deploy-brain-viz.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain-viz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brain-viz/package-lock.json
      - run: npm ci
      - run: dotnet tool restore
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: brain-viz/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
