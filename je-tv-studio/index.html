<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.E. TV Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Luckiest+Guy&display=swap">
<style>
/* J.E. TV Studio: a YouTube-style smart board app for a Deaf-Blind student.
   - Everything sized in rem off one root size, so the Aa button scales the whole app.
   - The "video player" is always dark (like YouTube) for the best contrast and least glare.
   - Each goal has one color everywhere: Speak It = pink, Word Twins = purple, Device Check = teal.
   - Scores always pair color + icon + word (never color alone). */
:root{
  --scale:1; --cap-scale:1;
  --yt:#ff0033;
  --g1:#ff3b6b; --g2:#a855f7; --g3:#14b8a6;
  --ind:#15803d; --pro:#b45309; --not:#b91c1c; --nr:#4b5563;
  --stage-bg:#0b0b0b; --stage-text:#ffffff; --stage-hi:#ffe14d;
  --display:"Luckiest Guy","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  --radius:18px;
}
html[data-theme="dark"]{--bg:#0f0f0f;--surface:#1f1f1f;--surface2:#2c2c2c;--line:#3f3f3f;--text:#ffffff;--muted:#d4d4d4;--focus:#3ea6ff;--bw:2px}
html[data-theme="light"]{--bg:#ffffff;--surface:#f1f1f1;--surface2:#e3e3e3;--line:#c9c9c9;--text:#0f0f0f;--muted:#333333;--focus:#065fd4;--bw:2px}
html[data-theme="contrast"]{--bg:#000;--surface:#000;--surface2:#141400;--line:#ffeb00;--text:#ffeb00;--muted:#ffeb00;--focus:#00e5ff;
  --g1:#ffeb00;--g2:#ffeb00;--g3:#ffeb00;--yt:#ffeb00;--stage-bg:#000;--stage-text:#ffeb00;--stage-hi:#00e5ff;--bw:3px}
*{box-sizing:border-box}
html{font-size:calc(22px * var(--scale))}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
[hidden]{display:none!important}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.15}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.8rem;padding:.5rem 1rem;background:var(--bg);border-bottom:var(--bw) solid var(--line);min-height:4rem}
.logo{display:flex;align-items:center;gap:.4rem;background:none;border:0;padding:.2rem;font-family:var(--display);font-size:1.6rem;letter-spacing:.5px;white-space:nowrap}
.logo .play{display:inline-grid;place-items:center;width:2.3rem;height:1.65rem;background:var(--yt);border-radius:.45rem;color:#fff;font-size:.9rem}
html[data-theme="contrast"] .logo .play{color:#000}
.logo sup{font-family:var(--body);font-size:.6rem;color:var(--muted);font-weight:700}
.search{flex:1;display:flex;max-width:34rem;margin:0 auto}
.search input{flex:1;min-width:0;height:2.6rem;padding:0 1rem;border:var(--bw) solid var(--line);border-right:0;border-radius:2rem 0 0 2rem;background:var(--bg)}
.search button{width:3.6rem;border:var(--bw) solid var(--line);border-radius:0 2rem 2rem 0;background:var(--surface);font-size:1.1rem}
.tools{display:flex;gap:.4rem;align-items:center}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:3.6rem;height:3.3rem;padding:0 .4rem;border-radius:.9rem;border:var(--bw) solid transparent;background:var(--surface);font-weight:700;font-size:.62rem;gap:.1rem}
.tool b{font-size:1.15rem;line-height:1}
.tool[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.tool[aria-pressed="false"]{opacity:.75;text-decoration:line-through}
.avatar{display:grid;place-items:center;width:3rem;height:3rem;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));font-size:1.6rem;flex:none}
html[data-theme="contrast"] .avatar{background:#000;border:3px solid var(--line)}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:calc(100vh - 4rem)}
.side{width:12rem;flex:none;padding:.6rem;border-right:var(--bw) solid var(--line);position:sticky;top:4rem;height:calc(100vh - 4rem);overflow:auto}
.nav{display:flex;align-items:center;gap:.7rem;width:100%;padding:.7rem .8rem;margin-bottom:.25rem;border:var(--bw) solid transparent;border-radius:.9rem;background:none;font-weight:700;font-size:.95rem;text-align:left}
.nav span{font-size:1.4rem}
.nav[aria-current="page"]{background:var(--surface2)}
html[data-theme="contrast"] .nav[aria-current="page"]{border-color:var(--line)}
.side hr{border:0;border-top:var(--bw) solid var(--line);margin:.6rem 0}
.side .mini{font-size:.75rem;color:var(--muted);padding:.2rem .8rem}
.side .mini b{color:var(--text);font-size:1rem}
main{flex:1;min-width:0;padding:1rem 1.4rem 6rem}

/* ---------- Channel banner ---------- */
.banner{border-radius:var(--radius);padding:1.4rem 1.6rem;background:linear-gradient(115deg,#ff0050 0%,#ff7a00 35%,#a855f7 70%,#14b8a6 100%);color:#fff;position:relative;overflow:hidden}
html[data-theme="contrast"] .banner{background:#000;border:3px solid var(--line);color:var(--text)}
.banner .row{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.banner .big-av{width:6rem;height:6rem;border-radius:50%;display:grid;place-items:center;font-size:3.4rem;background:#111;border:5px solid #fff}
.banner h1{font-family:var(--display);font-size:2.6rem;letter-spacing:1px;margin:0;text-shadow:3px 3px 0 rgba(0,0,0,.35)}
.banner .sub{font-weight:700;font-size:1rem;opacity:.95}
.subbtn{margin-left:auto;padding:.8rem 1.6rem;border-radius:2rem;border:0;background:#fff;color:#0f0f0f;font-weight:700;font-size:1.05rem}
.subbtn.on{background:#272727;color:#fff}
html[data-theme="contrast"] .subbtn{background:var(--line);color:#000}

.section-title{display:flex;align-items:center;gap:.6rem;font-size:1.4rem;font-weight:700;margin:1.4rem 0 .7rem}
.make-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.8rem}
.make{display:flex;align-items:center;gap:.8rem;padding:1rem 1.1rem;border-radius:var(--radius);border:var(--bw) solid var(--line);background:var(--surface);font-weight:700;font-size:1.1rem;text-align:left;min-height:5rem}
.make .ic{font-size:2.2rem}
.make small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.make.g1{border-left:10px solid var(--g1)} .make.g2{border-left:10px solid var(--g2)} .make.g3{border-left:10px solid var(--g3)}

/* ---------- Video grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:1.2rem 1rem}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:.5rem}
.thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 6%;color:#fff}
html[data-theme="contrast"] .thumb{border:3px solid var(--line);background:#000!important;color:var(--text)}
.thumb .te{font-size:4.2rem;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.35))}
.thumb .tt{font-family:var(--display);font-size:1.75rem;line-height:1;text-align:right;max-width:60%;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000;transform:rotate(-3deg)}
.thumb .dur{position:absolute;right:.4rem;bottom:.4rem;background:rgba(0,0,0,.85);color:#fff;font-weight:700;font-size:.75rem;padding:.1rem .4rem;border-radius:.3rem}
.thumb .watched{position:absolute;left:0;bottom:0;height:6px;background:var(--yt)}
.thumb .new{position:absolute;left:.4rem;top:.4rem;background:var(--yt);color:#fff;font-weight:700;font-size:.7rem;padding:.1rem .5rem;border-radius:.3rem}
.meta{display:flex;gap:.6rem}
.meta .avatar{width:2.4rem;height:2.4rem;font-size:1.2rem}
.meta .vt{font-weight:700;font-size:1rem;line-height:1.25}
.meta .vs{font-size:.8rem;color:var(--muted)}
.empty{padding:2rem;border:var(--bw) dashed var(--line);border-radius:var(--radius);text-align:center;color:var(--muted)}

/* ---------- Goal page ---------- */
.goalhead{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.goalhead .gi{font-size:3rem}
.goalhead h1{font-family:var(--display);font-size:2.4rem;letter-spacing:1px;margin:0}
details.iep{margin:.8rem 0;border:var(--bw) solid var(--line);border-radius:var(--radius);background:var(--surface);padding:.6rem 1rem}
details.iep summary{font-weight:700;cursor:pointer;padding:.3rem 0}
details.iep p{font-size:.95rem;margin:.4rem 0 .6rem}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.8rem}
.type{padding:1rem;border-radius:var(--radius);border:var(--bw) solid var(--line);background:var(--surface);text-align:left;min-height:6.5rem}
.type .ic{font-size:2.2rem;display:block}
.type b{font-size:1.1rem}
.type small{display:block;color:var(--muted);font-size:.78rem;margin-top:.2rem}
.type.surprise{background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));color:#fff;border:0}
html[data-theme="contrast"] .type.surprise{background:#000;color:var(--text);border:3px solid var(--line)}

/* ---------- Watch page ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:1.4rem;align-items:start}
.player{background:var(--stage-bg);color:var(--stage-text);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-height:50vh;border:var(--bw) solid #000}
html[data-theme="contrast"] .player{border-color:var(--line)}
.stage{flex:1;padding:1.4rem 1.8rem;display:flex;flex-direction:column;gap:1rem;position:relative;background:radial-gradient(ellipse at top,rgba(255,255,255,.07),transparent 70%)}
.cap{background:#000;color:#fff;font-weight:700;text-align:center;font-size:calc(1.9rem * var(--cap-scale));padding:.5rem 1rem;min-height:calc(2.9rem * var(--cap-scale));border-top:2px solid #333;line-height:1.25}
html[data-theme="contrast"] .cap{color:#ffeb00;border-top-color:#ffeb00}
.cap .cc{display:inline-block;font-size:.55em;border:2px solid currentColor;border-radius:.3rem;padding:0 .25rem;margin-right:.5rem;vertical-align:middle}
.pbar{display:flex;align-items:center;gap:.6rem;padding:.5rem .8rem;background:#111;border-top:2px solid #222}
html[data-theme="contrast"] .pbar{background:#000;border-top-color:#ffeb00}
.pbtn{min-width:3.4rem;height:3rem;border-radius:.7rem;border:2px solid #444;background:#222;color:#fff;font-size:1.2rem;font-weight:700;padding:0 .6rem}
html[data-theme="contrast"] .pbtn{background:#000;border-color:#ffeb00;color:#ffeb00}
.pbtn[aria-pressed="true"]{background:#fff;color:#000}
.progress{flex:1;height:10px;background:#444;border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--yt);transition:width .4s}
.pcount{color:#fff;font-weight:700;font-size:.9rem;white-space:nowrap}
html[data-theme="contrast"] .pcount{color:#ffeb00}
.vtitle{font-size:1.5rem;margin:.8rem 0 .4rem}
.vrow{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.vrow .who b{display:block}
.vrow .who small{color:var(--muted)}
.pill{padding:.6rem 1.1rem;border-radius:2rem;border:var(--bw) solid var(--line);background:var(--surface);font-weight:700;font-size:.95rem;min-height:3rem}
.pill.red{background:var(--text);color:var(--bg);border-color:var(--text)}
.desc{margin-top:.8rem;background:var(--surface);border-radius:var(--radius);padding:.8rem 1rem;font-size:.9rem}
.upnext h3{font-size:1.1rem}
.upnext .card{flex-direction:row;margin-bottom:.8rem}
.upnext .thumb{width:9rem;flex:none}
.upnext .thumb .te{font-size:2.2rem}.upnext .thumb .tt{font-size:.95rem;-webkit-text-stroke:1px #000}
.upnext .vt{font-size:.85rem}

/* ---------- Stage content ---------- */
.tag{align-self:flex-start;display:inline-flex;gap:.4rem;align-items:center;padding:.3rem .9rem;border-radius:2rem;background:rgba(255,255,255,.14);font-weight:700;font-size:.95rem}
html[data-theme="contrast"] .tag{background:#000;border:2px solid #ffeb00}
.passage{font-size:3.1rem;font-weight:700;line-height:1.45;margin:.2rem 0;text-align:center}
.passage.small{font-size:1.8rem;opacity:.85}
.w{padding:0 .12em;border-radius:.2em;transition:background .15s,color .15s}
.w.hf{text-decoration:underline;text-decoration-thickness:.09em;text-underline-offset:.18em;text-decoration-color:var(--stage-hi)}
.w.on{background:var(--stage-hi);color:#000}
.bigword{font-family:var(--display);font-size:5rem;text-align:center;letter-spacing:2px;line-height:1.05}
.prompt{font-size:2.1rem;font-weight:700;text-align:center;margin:0}
.prompt b{color:var(--stage-hi)}
.sent{font-size:1.8rem;text-align:center;margin:0;opacity:.95}
.sent mark{background:var(--stage-hi);color:#000;padding:0 .15em;border-radius:.2em}
.row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.sbtn{min-height:4.2rem;padding:.6rem 1.6rem;border-radius:1.2rem;border:3px solid rgba(255,255,255,.35);background:#262626;color:#fff;font-size:1.4rem;font-weight:700}
html[data-theme="contrast"] .sbtn{background:#000;border-color:#ffeb00;color:#ffeb00}
.sbtn.go{background:var(--yt);border-color:var(--yt);color:#fff}
html[data-theme="contrast"] .sbtn.go{background:#ffeb00;color:#000}
.sbtn:disabled{opacity:.4}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem}
.choice{min-height:7rem;border-radius:1.4rem;border:4px solid rgba(255,255,255,.4);background:#1d1d1d;color:#fff;font-size:2rem;font-weight:700;padding:.6rem 1rem;display:flex;align-items:center;justify-content:center;gap:.6rem;text-align:center;line-height:1.15}
html[data-theme="contrast"] .choice{background:#000;border-color:#ffeb00;color:#ffeb00}
.choice .ce{font-size:2.8rem}
.choice.right{background:var(--ind);border-color:#fff;color:#fff}
.choice.wrong{opacity:.35;text-decoration:line-through}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.turn{font-family:var(--display);font-size:3.4rem;text-align:center;color:var(--stage-hi);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.saybox{border:4px dashed var(--stage-hi);border-radius:1.2rem;padding:1rem 1.4rem;font-size:2.3rem;font-weight:700;text-align:center}
.saybox small{display:block;font-size:1rem;opacity:.85;margin-bottom:.3rem}
.nextbar{display:flex;justify-content:flex-end;margin-top:auto}
.dots{display:flex;gap:.6rem;justify-content:center;font-size:2.4rem}
.flash{font-family:var(--display);font-size:8rem;text-align:center;letter-spacing:3px;line-height:1}
.ling{font-family:var(--display);font-size:9rem;text-align:center;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem}
.tile{min-height:7rem;border-radius:1.4rem;border:4px solid rgba(255,255,255,.4);background:#1d1d1d;color:#fff;font-size:1.6rem;font-weight:700;display:flex;align-items:center;gap:.8rem;padding:1rem;text-align:left}
.tile .ce{font-size:2.6rem}
.tile.done{background:var(--ind);border-color:#fff}
html[data-theme="contrast"] .tile{background:#000;border-color:#ffeb00;color:#ffeb00}
html[data-theme="contrast"] .tile.done{background:#ffeb00;color:#000}
.seq{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.slots{display:flex;flex-direction:column;gap:.6rem}
.slot{min-height:4rem;border:3px dashed rgba(255,255,255,.45);border-radius:1rem;display:flex;align-items:center;gap:.6rem;padding:.4rem 1rem;font-size:1.4rem;font-weight:700}
.slot.filled{border-style:solid;background:var(--ind);border-color:#fff}
.slot .n{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:#fff;color:#000;flex:none}
.typein{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.typein input{font-size:2rem;padding:.4rem 1rem;border-radius:1rem;border:3px solid rgba(255,255,255,.5);background:#000;color:#fff;width:min(22rem,90%)}
.answers{font-size:1.6rem;text-align:center}
.answers b{color:var(--stage-hi)}
.result-chips{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.rchip{font-size:1.6rem;font-weight:700;padding:.4rem 1rem;border-radius:1rem;border:3px solid #fff}
.rchip.ok{background:var(--ind)} .rchip.no{background:var(--not)}
.finish{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;flex:1;text-align:center}
.finish h2{font-family:var(--display);font-size:4rem;letter-spacing:2px;margin:0}

/* ---------- Coach panel ---------- */
#watchCol:fullscreen{background:var(--bg);padding:1rem;overflow:auto}
#watchCol:fullscreen .player{min-height:62vh}
.coach{margin-top:1rem;border:var(--bw) dashed var(--line);border-radius:var(--radius);padding:.8rem 1rem;background:var(--surface)}
.coach .ch{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:.95rem;color:var(--muted);margin-bottom:.5rem;flex-wrap:wrap}
.coach .hint{margin:.2rem 0;font-size:.95rem}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.score{min-height:4.4rem;border-radius:1rem;border:3px solid transparent;color:#fff;font-weight:700;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;line-height:1.1}
.score b{font-size:1.5rem}
.s-ind{background:var(--ind)} .s-pro{background:var(--pro)} .s-not{background:var(--not)} .s-nr{background:var(--nr)}
html[data-theme="contrast"] .score{border-color:#ffeb00}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.3rem 0 .7rem}
.chip{min-height:2.8rem;padding:.3rem .9rem;border-radius:2rem;border:var(--bw) solid var(--line);background:var(--bg);font-weight:700;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ind);color:#fff;border-color:var(--ind)}
.last{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.85rem;padding:.4rem .6rem;border-radius:.8rem;background:var(--bg);margin-bottom:.6rem}
.last .mini{min-height:2.4rem;min-width:2.6rem;border-radius:.6rem;border:var(--bw) solid var(--line);background:var(--surface);font-size:1rem}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .6rem;border-radius:1rem;color:#fff;font-weight:700;font-size:.85rem;white-space:nowrap}
.rec{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.rec audio{height:2.6rem}

/* ---------- Celebration ---------- */
.party{position:fixed;inset:0;z-index:80;display:grid;place-items:center;pointer-events:none}
.party .msg{background:var(--yt);color:#fff;font-family:var(--display);font-size:3.6rem;letter-spacing:2px;padding:1.2rem 2.4rem;border-radius:2rem;border:6px solid #fff;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:pop .9s ease-out both;text-align:center}
html[data-theme="contrast"] .party .msg{background:#000;color:#ffeb00;border-color:#ffeb00}
.party .msg small{display:block;font-family:var(--body);font-size:1.3rem;font-weight:700;letter-spacing:0}
.party .fx{position:absolute;font-size:3.4rem;animation:fly 1.4s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.12);opacity:1}70%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes fly{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:70;background:#000;color:#fff;font-weight:700;font-size:calc(1.6rem * var(--cap-scale));padding:.6rem 1.4rem;border-radius:1rem;max-width:92vw;text-align:center;border:3px solid #fff}
html[data-theme="contrast"] .toast{color:#ffeb00;border-color:#ffeb00}

/* ---------- Data & settings ---------- */
.panel{background:var(--surface);border-radius:var(--radius);padding:1rem 1.2rem;margin-bottom:1rem;border:var(--bw) solid var(--line)}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:1rem;margin-bottom:1rem}
.gcard{border-radius:var(--radius);padding:1rem 1.2rem;background:var(--surface);border:var(--bw) solid var(--line);border-top:10px solid var(--gc)}
.gcard .pct{font-size:3rem;font-weight:700;line-height:1}
.gcard .bar{position:relative;height:1.1rem;background:var(--surface2);border-radius:.6rem;margin:.6rem 0 .4rem;overflow:visible}
.gcard .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:.6rem;background:var(--gc)}
.gcard .bar u{position:absolute;top:-.35rem;bottom:-.35rem;width:4px;background:var(--text);left:20%}
.gcard .small{font-size:.85rem;color:var(--muted)}
.status{display:inline-block;margin-top:.4rem;font-weight:700;font-size:.9rem;padding:.2rem .7rem;border-radius:1rem;border:var(--bw) solid var(--line)}
.btnrow{display:flex;gap:.6rem;flex-wrap:wrap}

/* Short "ding" for correct answers (helps with residual hearing). */
let actx;
function ding(good=true){
  if(!S.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=good?[660,880,1320]:[300,220];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,actx.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.35,actx.currentTime+i*.12+.02);
      g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+i*.12+.25);o.connect(g).connect(actx.destination);
      o.start(actx.currentTime+i*.12);o.stop(actx.currentTime+i*.12+.3);});
  }catch(e){}
}

   CONTENT GENERATION
   ===================================================================== */
function customPassages(){
  return (S.customPassages||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const [s,q,a,w1,w2]=l.split('|').map(x=>(x||'').trim());
    const p={t:'custom',lv:0,s};
    if(q&&a&&w1) Object.assign(p,{q,a:[a,'✅'],w:[[w1,'❌'],[w2||'something else','❌']]});
    return p;
  }).filter(p=>p.s);
}
function customWords(){
  return (S.customWords||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const [w,syn,ant,s]=l.split('|').map(x=>(x||'').trim());
    return {w,e:'⭐',tier:'Custom',syn:(syn||'').split(',').map(x=>x.trim()).filter(Boolean),ant:(ant||'').split(',').map(x=>x.trim()).filter(Boolean),s:s||''};
  }).filter(x=>x.w&&x.syn.length&&x.ant.length);
}
function passagePool(needQ){
  let pool=PASSAGES.filter(p=>S.interests.includes(p.t));
  if(S.level==='1') pool=pool.filter(p=>p.lv===1);
  if(S.level==='2') pool=pool.filter(p=>p.lv===2);
  pool=pool.concat(customPassages());
  if(needQ) pool=pool.filter(p=>p.q);
  if(pool.length<3) pool=pool.concat(PASSAGES.filter(p=>!needQ||p.q));
  return pool;
}
function wordPool(){ const c=customWords(); return c.length>=3?c.concat(WORDS):WORDS.concat(c); }
function makeChoices(w,kind){
  const right=rand(w[kind]);
  const other=rand(w[kind==='syn'?'ant':'syn']);
  const pool=wordPool().filter(x=>x.w!==w.w && ![...w.syn,...w.ant].includes(x.w));
  const filler=rand(pool).w;
  return shuffle([{label:right,ok:true},{label:other},{label:filler}]);
}
function generate(goal,type){
  goal=+goal;
  if(!type) type=rand(Object.keys(TYPES).filter(k=>TYPES[k].goal===goal));
  const T=TYPES[type]; store.n=(store.n||0)+1;
  const act={id:uid(),goal:T.goal,type,created:Date.now(),views:Math.floor(800+Math.random()*48000),
    dur:`${2+Math.floor(Math.random()*7)}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`,items:[],done:0};
  const wp=wordPool();
  switch(type){
    case 'readsay': act.items=sample(passagePool(),3); break;
    case 'echo': act.items=sample(passagePool(),2); break;
    case 'cfu': act.items=sample(passagePool(true),3); break;
    case 'hfw': act.items=sample(passagePool(),2); break;
    case 'syn': act.items=sample(wp,5).map(w=>({w,choices:makeChoices(w,'syn')})); break;
    case 'ant': act.items=sample(wp,5).map(w=>({w,choices:makeChoices(w,'ant')})); break;
    case 'sameopp': act.items=sample(wp,6).map(w=>{const rel=Math.random()<.5?'syn':'ant';return {w,rel,b:rand(w[rel])};}); break;
    case 'sayboth': act.items=sample(wp,4).map(w=>({w})); break;
    case 'soundcheck': act.items=[{}]; break;
    case 'fixit': act.items=sample(FIXES,4).map(f=>({...f,choices:shuffle([{label:f.a[0],e:f.a[1],ok:true},...f.w.map(([l,e])=>({label:l,e}))])})); break;
    case 'speakup': act.items=sample(SPEAK,3); break;
    case 'routine': act.items=sample(ROUTINES,2).map(r=>({...r,order:shuffle(r.steps.map((s,i)=>i))})); break;
  }
  const first=act.items[0]||{};
  const topicKey=first.t&&TOPICS[first.t]?first.t:null;
  act.te = topicKey?TOPICS[topicKey][1]:(first.w&&first.w.e)||first.e||T.e;
  act.title = rand(T.titles).replace('{topic}',topicKey?TOPICS[topicKey][0]:'Custom').replace('{te}',act.te).replace('{n}',store.n);
  store.uploads.unshift(act);
  store.uploads=store.uploads.slice(0,48);
  save();
  return act;
}

function rubricHTML(){ return `<div class="hint">Check what you observed, then score:</div><div class="chips">${RUBRIC.map(([k,l])=>`<button class="chip" data-rub="${k}" aria-pressed="false">${l}</button>`).join('')}</div>`; }
function bindRubric(){ $$('#coachBody [data-rub]').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')); }
function rubricText(){ return RUBRIC.map(([k,l])=>{const b=document.querySelector(`#coachBody [data-rub="${k}"]`);return l.slice(2).trim()+(b&&b.getAttribute('aria-pressed')==='true'?' ✓':' ✗');}).join(', '); }
/* Suggest a score from the rubric so the teacher can tap once. */
function rubricAutoHint(){
  $$('#coachBody [data-rub]').forEach(b=>b.addEventListener('click',()=>{
    const on=$$('#coachBody [data-rub][aria-pressed="true"]').length;
    $$('#coachBody [data-score]').forEach(x=>x.style.outline='');
    const k=on===3?'ind':on>0?'pro':null;
    if(k){ const el=document.querySelector(`#coachBody [data-score="${k}"]`); if(el) el.style.outline='5px solid var(--text)'; }
  }));
}
function choiceGrid(choices){
  return `<div class="choices" id="choices">${choices.map((c,i)=>`<button class="choice" data-c="${i}">${c.e?`<span class="ce">${c.e}</span>`:''}<span>${esc(D(c.label))}</span></button>`).join('')}</div>`;
}
/* Tap choices: first-try correct = Independent, correct after a miss = With prompt. */
function bindChoices(choices,onDone){
  let misses=0, done=false;
  $$('#choices [data-c]').forEach(b=>b.onclick=()=>{
    if(done) return;
    const c=choices[+b.dataset.c];
    if(c.ok){ done=true; b.classList.add('right'); onDone(misses,c); }
    else { misses++; b.classList.add('wrong','shake'); ding(false); say('Not yet. Try again!'); }
  });
}

/* ---------- Language sample recorder ---------- */
let rec=null, recChunks=[], recStream=null;
function recorderHTML(){ return `<div class="rec"><button class="chip" id="recBtn">🎙️ Record language sample</button><span id="recOut"></span></div>`; }
function bindRecorder(label){
  const btn=$('#recBtn'); if(!btn) return;
  if(!navigator.mediaDevices||!window.MediaRecorder){ btn.disabled=true; btn.textContent='🎙️ Recording not supported here'; return; }
  btn.onclick=async()=>{
    if(rec&&rec.state==='recording'){ rec.stop(); return; }
    try{
      recStream=await navigator.mediaDevices.getUserMedia({audio:true});
      rec=new MediaRecorder(recStream); recChunks=[];
      rec.ondataavailable=e=>recChunks.push(e.data);
      rec.onstop=()=>{
        recStream.getTracks().forEach(t=>t.stop());
        const blob=new Blob(recChunks,{type:rec.mimeType||'audio/webm'}); const url=URL.createObjectURL(blob);
        const name=`${S.student.replace(/\W/g,'')}-sample-${today()}-${label.replace(/\W+/g,'-').slice(0,30)}.webm`;
        const out=$('#recOut'); if(out) out.innerHTML=`<audio controls src="${url}"></audio> <button class="chip" id="saveRec">💾 Save sample</button>`;
        bind('saveRec',()=>download(name,blob,'audio/webm'));
        if(P) P.sampled=true;
        btn.textContent='🎙️ Record again'; btn.setAttribute('aria-pressed','false');
      };
      rec.start(); btn.textContent='⏹️ Stop recording'; btn.setAttribute('aria-pressed','true');
    }catch(e){ toast('Microphone not available'); }
  };
}
function stopRec(){ try{ if(rec&&rec.state==='recording') rec.stop(); }catch(e){} }

/* =====================================================================
   ACTIVITY RUNNERS
   ===================================================================== */
const RUN = {
  /* ---- Goal 1: Read & Say ---- */
  readsay(item){
    stage(`<div class="tag">📖 Read & Say · Passage ${P.i+1}</div>${passageHTML(item.s)}
      <div class="row"><button class="sbtn" id="listen">🔊 Listen</button><button class="sbtn go" id="myturn">🗣️ My turn!</button></div>
      <div class="turn" id="turn" hidden>🗣️ YOUR TURN! SAY IT!</div>`);
    bind('listen',()=>readAlong(item.s));
    bind('myturn',()=>{ $('#turn').hidden=false; say('Your turn! Say it.'); });
    coach(rubricHTML()+scoreButtons()+recorderHTML());
    bindRubric(); rubricAutoHint(); bindRecorder(item.s);
    onScore(sc=>{ logTrial({type:'Read & Say',item:item.s,score:sc,detail:rubricText()+(P.sampled?', sample recorded':'')}); P.sampled=false; coach('<p class="hint">Saved. Tap <b>Next ▶</b>.</p>'); showNext(); });
    later(()=>readAlong(item.s,'psg',()=>{ $('#turn').hidden=false; say('Your turn! Say it.'); }),700);
  },
  /* ---- Goal 1: Echo x3 (repetition) ---- */
  echo(item){
    P.round=P.round||1;
    stage(`<div class="tag">🔁 Echo x3 · Round ${P.round} of 3</div>
      <div class="dots">${[1,2,3].map(r=>r<P.round?'⭐':r===P.round?'🎤':'⚪').join('')}</div>
      ${passageHTML(item.s)}
      <div class="row"><button class="sbtn" id="listen">🔊 Listen</button><button class="sbtn go" id="myturn">🗣️ My turn!</button></div>
      <div class="turn" id="turn" hidden>🗣️ ECHO IT!</div>`);
    bind('listen',()=>readAlong(item.s));
    bind('myturn',()=>{ $('#turn').hidden=false; say('Echo it!'); });
    coach(rubricHTML()+scoreButtons()+recorderHTML());
    bindRubric(); rubricAutoHint(); bindRecorder(item.s);
    onScore(sc=>{
      logTrial({type:'Echo x3',item:item.s,score:sc,detail:`Round ${P.round}; `+rubricText()});
      if(P.round<3){ P.round++; later(rerender,900); }
      else { coach('<p class="hint">3 rounds done! Tap <b>Next ▶</b>.</p>'); showNext(); }
    });
    later(()=>readAlong(item.s,'psg',()=>{ $('#turn').hidden=false; say('Echo it!'); }),700);
  },
  /* ---- Goal 1: Check It (CFU) ---- */
  cfu(item){
    const ph=P.phase||'listen';
    if(ph==='listen'){
      stage(`<div class="tag">❓ Check It · Listen first</div>${passageHTML(item.s)}
        <div class="row"><button class="sbtn" id="listen">🔊 Listen again</button><button class="sbtn go" id="toQ">❓ Question time</button></div>`);
      coach('<p class="hint">Read the passage together (repeat as needed). Then tap <b>Question time</b>.</p>');
      bind('listen',()=>readAlong(item.s)); bind('toQ',()=>{P.phase='q';rerender();});
      later(()=>readAlong(item.s),700);
    } else if(ph==='q'){
      const choices=shuffle([{label:item.a[0],e:item.a[1],ok:true},...item.w.map(([l,e])=>({label:l,e}))]);
      stage(`<div class="tag">❓ Check It · Question</div>${passageHTML(item.s,'psg',true)}<p class="prompt">${esc(item.q)}</p>${choiceGrid(choices)}`);
      coach('<p class="hint">Student taps an answer. First try = Independent. The score saves by itself.</p>');
      say(item.q);
      bindChoices(choices,(misses)=>{
        logTrial({type:'Check It (question)',item:item.q+' → '+item.a[0],score:misses?'pro':'ind',detail:misses?`${misses} miss(es) first`:'First try',primary:false});
        later(()=>{P.phase='say';rerender();},1700);
      });
    } else {
      stage(`<div class="tag">🗣️ Now say the whole thing!</div>${passageHTML(item.s)}
        <div class="row"><button class="sbtn" id="listen">🔊 Listen</button></div><div class="turn">🗣️ YOUR TURN!</div>`);
      bind('listen',()=>readAlong(item.s));
      say('Now say the whole thing!');
      coach(rubricHTML()+scoreButtons()+recorderHTML());
      bindRubric(); rubricAutoHint(); bindRecorder(item.s);
      onScore(sc=>{ logTrial({type:'Check It (say passage)',item:item.s,score:sc,detail:rubricText()+(P.sampled?', sample recorded':'')}); P.sampled=false; coach('<p class="hint">Saved. Tap <b>Next ▶</b>.</p>'); showNext(); });
    }
  },
  /* ---- Goal 1: Word Power (high-frequency words, then passage) ---- */
  hfw(item){
    const words=[...new Set(item.s.split(/\s+/).map(w=>w.toLowerCase().replace(/[^a-z']/g,'')).filter(w=>HF.has(w)))].slice(0,5);
    const k=P.phase??0;
    if(k<words.length){
      const w=words[k];
      stage(`<div class="tag">⚡ Word Power · Word ${k+1} of ${words.length}</div>
        <div class="flash">${esc(w)}</div>
        <div class="row"><button class="sbtn" id="listen">🔊 Hear it</button></div><div class="turn">🗣️ SAY IT!</div>`);
      bind('listen',()=>say(w));
      later(()=>say(w),500);
      coach('<p class="hint">Sight word practice (counts as practice, not a goal measure).</p>'+scoreButtons());
      onScore(sc=>{ logTrial({type:'Word Power (sight word)',item:w,score:sc,primary:false,quiet:sc!=='ind'}); P.phase=k+1; later(rerender,800); });
    } else {
      stage(`<div class="tag">⚡ Word Power · Now the whole passage!</div>${passageHTML(item.s)}
        <div class="row"><button class="sbtn" id="listen">🔊 Listen</button><button class="sbtn go" id="myturn">🗣️ My turn!</button></div>
        <div class="turn" id="turn" hidden>🗣️ YOUR TURN!</div>`);
      bind('listen',()=>readAlong(item.s));
      bind('myturn',()=>{ $('#turn').hidden=false; say('Your turn!'); });
      coach(rubricHTML()+scoreButtons()+recorderHTML());
      bindRubric(); rubricAutoHint(); bindRecorder(item.s);
      onScore(sc=>{ logTrial({type:'Word Power (say passage)',item:item.s,score:sc,detail:rubricText()+(P.sampled?', sample recorded':'')}); P.sampled=false; coach('<p class="hint">Saved. Tap <b>Next ▶</b>.</p>'); showNext(); });
      later(()=>readAlong(item.s),700);
    }
  },
  /* ---- Goal 2: Synonyms / Antonyms ---- */
  syn(item){ wordQuestion(item,'syn'); },
  ant(item){ wordQuestion(item,'ant'); },
  sameopp(item){
    const w=item.w;
    stage(`<div class="tag">🤔 Same or Opposite? · ${P.i+1} of ${P.act.items.length}</div>
      <div class="bigword">${esc(w.w)} <span style="opacity:.6">&amp;</span> ${esc(item.b)}</div>
      <p class="prompt">Do these words mean the <b>SAME</b> or the <b>OPPOSITE</b>?</p>
      <div class="choices" id="choices"><button class="choice" data-c="0"><span class="ce">🤝</span>SAME</button><button class="choice" data-c="1"><span class="ce">↔️</span>OPPOSITE</button></div>`);
    say(`${w.w} and ${item.b}. Same, or opposite?`);
    coach('<p class="hint">Student taps SAME or OPPOSITE. First try = Independent (saves by itself). Then have the student say both words.</p>');
    const choices=[{label:'SAME',ok:item.rel==='syn'},{label:'OPPOSITE',ok:item.rel==='ant'}];
    bindChoices(choices,(misses)=>{
      const rel=item.rel==='syn'?'mean the SAME (synonyms)':'are OPPOSITES (antonyms)';
      logTrial({type:'Same or Opposite',item:`${w.w} / ${item.b} → ${item.rel==='syn'?'synonym':'antonym'}`,score:misses?'pro':'ind'});
      $('#stage').insertAdjacentHTML('beforeend',`<div class="saybox"><small>Say it!</small>${esc(cap1(w.w))} and ${esc(item.b)} ${rel}.</div>`);
      later(()=>say(`${cap1(w.w)} and ${item.b} ${rel}. Say it!`),1200);
      oralFollowUp(); showNext();
    });
  },
  sayboth(item){
    const w=item.w; const ph=P.phase||'syn';
    const isSyn=ph==='syn'; const list=w[ph];
    stage(`<div class="tag">🎤 Say Both · ${isSyn?'Step 1: SAME':'Step 2: OPPOSITE'} · Word ${P.i+1} of ${P.act.items.length}</div>
      <div class="bigword">${w.e} ${esc(w.w)}</div>
      ${w.s?`<p class="sent">${markWord(w.s,w.w)}</p>`:''}
      <p class="prompt">Say a word that means the <b>${isSyn?'SAME 🤝':'OPPOSITE ↔️'}</b> as <b>${esc(w.w)}</b>.</p>
      <div class="typein"><input id="typeIn" placeholder="✏️ or write it here" autocomplete="off" aria-label="Write your word"><button class="sbtn" id="check">Check ✔️</button><button class="sbtn" id="reveal">👀 Show answers</button></div>
      <div class="answers" id="answers" aria-live="polite"></div>`);
    say(`Say a word that means the ${isSyn?'same':'opposite'} as ${w.w}.`);
    bind('check',()=>{
      const v=$('#typeIn').value.trim().toLowerCase(); if(!v) return;
      const ok=list.some(x=>x.toLowerCase()===v);
      $('#answers').innerHTML=ok?`✅ Yes! <b>${esc(v)}</b> ${isSyn?'means the same as':'is the opposite of'} ${esc(w.w)}.`:`🤔 <b>${esc(v)}</b> is not on my list. Ask your teacher!`;
      if(ok){ ding(true); say(`Yes! ${v}.`);} else ding(false);
      P.typed=v;
    });
    bind('reveal',()=>{ $('#answers').innerHTML=`${isSyn?'Same':'Opposite'}: <b>${list.map(esc).join(', ')}</b>`; say(`${isSyn?'Same':'Opposite'}: ${list.join(', ')}`); P.revealed=true; });
    coach('<p class="hint">Listen (or read the written word), then score. Tell me if answers were revealed before the response.</p>'+scoreButtons());
    onScore(sc=>{
      logTrial({type:`Say Both (${isSyn?'synonym':'antonym'})`,item:`${w.w} → ${isSyn?'synonym':'antonym'}`,score:sc,
        detail:[P.typed?`Wrote: ${P.typed}`:'Oral',P.revealed?'answers shown':''].filter(Boolean).join('; ')});
      P.typed=''; P.revealed=false;
      if(isSyn){ P.phase='ant'; later(rerender,900); } else { coach('<p class="hint">Both done! Tap <b>Next ▶</b>.</p>'); showNext(); }
    });
  },
  /* ---- Goal 3: Sound Check (Ling 6) ---- */
  soundcheck(){
    const ph=P.phase||'prep';
    if(ph==='prep'){
      P.prep=P.prep||[false,false,false];
      const tiles=[['🔛',`My ${D('{d}')} is ON`],['🔋','The battery is good'],['👂','It is in place']];
      stage(`<div class="tag">🎧 Sound Check · Get ready</div><p class="prompt">Tap each step when it is done.</p>
        <div class="tiles">${tiles.map(([e,t],i)=>`<button class="tile ${P.prep[i]?'done':''}" data-t="${i}"><span class="ce">${P.prep[i]?'✅':e}</span>${esc(t)}</button>`).join('')}</div>
        <div class="row"><button class="sbtn go" id="startLing" ${P.prep.every(Boolean)?'':'disabled'}>Start the 6 sounds ▶</button></div>`);
      $$('[data-t]').forEach(b=>b.onclick=()=>{P.prep[+b.dataset.t]=!P.prep[+b.dataset.t]; if(P.prep[+b.dataset.t]) ding(true); rerender();});
      bind('startLing',()=>{P.phase='ling';P.lk=0;P.ling=[];rerender();});
      coach('<p class="hint">Student checks the device and taps each step. Help only as needed. You will score the whole sound check at the end.</p>');
      if(!P.prep.some(Boolean)) say('Get ready for your sound check.');
    } else if(ph==='ling'){
      const L=LING[P.lk];
      stage(`<div class="tag">🎧 Sound Check · Sound ${P.lk+1} of 6</div><div class="ling">${L.s}</div>
        <p class="sent">${esc(L.hint)}</p>
        <div class="choices" id="lingBtns"><button class="choice" data-h="1"><span class="ce">✅</span>I heard it</button><button class="choice" data-h="0"><span class="ce">❌</span>I did not hear it</button></div>`);
      coach(`<p class="hint">Adult: say <b>“${L.s}”</b> live, with your mouth covered (best), or tap <button class="chip" id="ttsLing">🔊 play it</button>. Student repeats it or taps a button.</p>`);
      bind('ttsLing',()=>say(L.say,{caption:false}));
      $$('#lingBtns [data-h]').forEach(b=>b.onclick=()=>{ P.ling[P.lk]=b.dataset.h==='1'; ding(P.ling[P.lk]); P.lk++; if(P.lk>=6) P.phase='result'; later(rerender,350); });
    } else {
      const heard=P.ling.filter(Boolean).length;
      stage(`<div class="tag">🎧 Sound Check · Results</div>
        <div class="result-chips">${LING.map((L,i)=>`<span class="rchip ${P.ling[i]?'ok':'no'}">${P.ling[i]?'✅':'❌'} ${L.s}</span>`).join('')}</div>
        <p class="prompt">Is your ${esc(D('{d}'))} working?</p>
        <div class="choices" id="workBtns"><button class="choice" data-wk="1"><span class="ce">👍</span>YES</button><button class="choice" data-wk="0"><span class="ce">👎</span>NO</button></div>
        <div id="adv"></div>`);
      say(`You heard ${heard} of 6 sounds. Is your ${D('{d}')} working?`);
      $$('#workBtns [data-wk]').forEach(b=>b.onclick=()=>{
        P.working=b.dataset.wk==='1';
        $$('#workBtns .choice').forEach(x=>x.classList.remove('right')); b.classList.add('right');
        $('#adv').innerHTML=P.working?`<div class="saybox">🎉 Great! Your sound check is done.</div>`:`<div class="saybox"><small>Tell an adult:</small>“${esc(D('My {d} is not working. Can you help me?'))}”</div>`;
        say(P.working?'Great! Your sound check is done.':D('Tell an adult: My {d} is not working. Can you help me?'));
      });
      coach('<p class="hint">How independently did the student do the WHOLE sound check (get ready, 6 sounds, report)?</p>'+scoreButtons());
      onScore(sc=>{
        const missed=LING.filter((L,i)=>!P.ling[i]).map(L=>L.s);
        logTrial({type:'Sound Check',item:'Sound check (Ling 6)',score:sc,detail:`Heard ${heard}/6${missed.length?'; missed: '+missed.join(' '):''}; working: ${P.working===undefined?'not answered':P.working?'yes':'no'}`});
        showNext('Done ▶');
      });
    }
  },
  /* ---- Goal 3: Fix It (troubleshooting) ---- */
  fixit(item){
    stage(`<div class="tag">🔧 Fix It! · Problem ${P.i+1} of ${P.act.items.length}</div>
      <div class="bigword" style="font-size:4.4rem">${item.e}</div><p class="prompt">${esc(D(item.p))}<br>What do you do?</p>${choiceGrid(item.choices)}`);
    say(D(item.p)+' What do you do?');
    coach('<p class="hint">Student taps an answer. First try = Independent (saves by itself). Then practice saying the help sentence.</p>');
    bindChoices(item.choices,(misses)=>{
      logTrial({type:'Fix It (troubleshoot)',item:D(item.p)+' → '+D(item.a[0]),score:misses?'pro':'ind'});
      $('#stage').insertAdjacentHTML('beforeend',`<div class="saybox"><small>Then say:</small>“${esc(D(item.say))}”</div>`);
      later(()=>say(D(item.say)),1300);
      showNext();
    });
  },
  /* ---- Goal 3: Speak Up (advocacy) ---- */
  speakup(item){
    stage(`<div class="tag">🙋 Speak Up! · ${P.i+1} of ${P.act.items.length}</div>
      <div class="bigword" style="font-size:4.4rem">${item.e}</div><p class="prompt">${esc(D(item.p))}<br>What can you say?</p>
      <div class="row"><button class="sbtn" id="hint">💡 Show me what to say</button><button class="sbtn" id="hear">🔊 Hear it</button></div>
      <div id="script"></div>`);
    say(D(item.p)+' What can you say?');
    bind('hint',()=>{ $('#script').innerHTML=`<div class="saybox"><small>You can say:</small>“${esc(D(item.say))}”</div>`; P.hinted=true; });
    bind('hear',()=>{ $('#script').innerHTML=`<div class="saybox"><small>You can say:</small>“${esc(D(item.say))}”</div>`; say(D(item.say)); P.hinted=true; });
    coach('<p class="hint">Role-play: you are the adult. Score the student\'s request. (If you showed the script first, that is usually “With prompt”.)</p>'+scoreButtons());
    onScore(sc=>{ logTrial({type:'Speak Up (advocacy)',item:D(item.p),score:sc,detail:P.hinted?'Script shown':'No script'}); P.hinted=false; coach('<p class="hint">Saved. Tap <b>Next ▶</b>.</p>'); showNext(); });
  },
  /* ---- Goal 3: Routine sequencing ---- */
  routine(item){
    P.placed=P.placed||[]; P.err=P.err||0;
    const steps=item.steps.map(D);
    const nextIdx=P.placed.length;
    stage(`<div class="tag">${item.e} ${esc(item.name)} · Put the steps in order</div>
      <div class="seq">
        <div class="slots">${steps.map((s,i)=>`<div class="slot ${i<nextIdx?'filled':''}"><span class="n">${i+1}</span>${i<nextIdx?esc(s):''}</div>`).join('')}</div>
        <div class="slots">${item.order.filter(i=>!P.placed.includes(i)).map(i=>`<button class="tile" data-s="${i}" style="min-height:4rem;font-size:1.3rem">${esc(steps[i])}</button>`).join('')}</div>
      </div>`);
    if(nextIdx===0) say(`${item.name}. What comes first?`);
    coach('<p class="hint">Student taps the steps in order. 0 mistakes = Independent, otherwise With prompt (saves by itself).</p>');
    $$('[data-s]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.s;
      if(i===nextIdx){ P.placed.push(i); ding(true); say(steps[i]);
        if(P.placed.length===steps.length){
          logTrial({type:'Charge Routine (sequence)',item:item.name,score:P.err?'pro':'ind',detail:`${P.err} mistake(s)`});
          P.placed=[]; P.err=0;
          $$('.slot').forEach(s=>s.classList.add('filled'));
          $$('.seq .slots')[0].innerHTML=steps.map((s,k)=>`<div class="slot filled"><span class="n">${k+1}</span>${esc(s)}</div>`).join('');
          $$('.seq .slots')[1].innerHTML='<div class="saybox">🎉 All in order!</div>';
          showNext();
        } else later(rerender,250);
      } else { P.err++; b.classList.add('shake'); ding(false); say('Not yet. What comes next?'); setTimeout(()=>b.classList.remove('shake'),500); }
    });
  }
};
function markWord(s,w){ return esc(s).replace(new RegExp(`\\b(${w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b`,'i'),'<mark>$1</mark>'); }
function wordQuestion(item,kind){
  const w=item.w, isSyn=kind==='syn';
  stage(`<div class="tag">${isSyn?'👯 Word Twins':'🔄 Opposite Day'} · ${w.tier} word · ${P.i+1} of ${P.act.items.length}</div>
    <div class="bigword">${w.e} ${esc(w.w)}</div>
    ${w.s?`<p class="sent">${markWord(w.s,w.w)}</p>`:''}
    <p class="prompt">Which word means ${isSyn?'the <b>SAME</b> as':'the <b>OPPOSITE</b> of'} <b>${esc(w.w)}</b>?</p>
    ${choiceGrid(item.choices)}`);
  say(`${w.s} Which word means the ${isSyn?'same as':'opposite of'} ${w.w}?`);
  coach('<p class="hint">Student taps a word. First try = Independent (saves by itself). Then the student says the pair out loud.</p>');
  bindChoices(item.choices,(misses,c)=>{
    logTrial({type:isSyn?'Word Twins (synonym)':'Opposite Day (antonym)',item:`${w.w} → ${c.label}`,score:misses?'pro':'ind'});
    const line=isSyn?`${cap1(w.w)} and ${c.label} mean the same.`:`${cap1(w.w)} is the opposite of ${c.label}.`;
    $('#stage').insertAdjacentHTML('beforeend',`<div class="saybox"><small>Say it!</small>${esc(line)}</div>`);
    later(()=>say(line+' Say it!'),1300);
    oralFollowUp(); showNext();
  });
}

let dataRange='all', dataGoal='all';
function inRange(e){
  if(dataRange==='all') return true;
  const days=+dataRange; return Date.now()-e.ts <= days*864e5;
}
function stats(goal,entries){
  const e=entries.filter(x=>x.goal===goal&&x.primary);
  const c=k=>e.filter(x=>x.score===k).length;
  const n=e.length;
  return {n,ind:c('ind'),pro:c('pro'),not:c('not'),nr:c('nr'),pct:n?Math.round(c('ind')/n*100):0,practice:entries.filter(x=>x.goal===goal&&!x.primary).length,
    last:e.length?e[e.length-1].date:null};
}
function chartSVG(entries){
  const dates=[...new Set(entries.filter(e=>e.primary).map(e=>e.date))].sort();
  if(!dates.length) return '<div class="empty">The chart appears after the first scored trial.</div>';
  const W=900,H=300,L=56,R=20,T=16,B=50;
  const x=i=>dates.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(dates.length-1);
  const y=v=>T+(100-v)*(H-T-B)/100;
  let g='';
  [0,20,40,60,80,100].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-10}" y="${y(v)+5}" text-anchor="end" font-size="14" fill="var(--muted)">${v}%</text>`; });
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(20)}" y2="${y(20)}" stroke="var(--text)" stroke-width="2.5" stroke-dasharray="8 6"/><text x="${W-R}" y="${y(20)-8}" text-anchor="end" font-size="14" font-weight="700" fill="var(--text)">Goal 20%</text>`;
  const step=Math.ceil(dates.length/8);
  dates.forEach((d,i)=>{ if(i%step===0||i===dates.length-1) g+=`<text x="${x(i)}" y="${H-B+24}" text-anchor="middle" font-size="13" fill="var(--muted)">${d.slice(5)}</text>`; });
  const dash={1:'',2:'10 5',3:'3 5'};
  [1,2,3].forEach(goal=>{
    const pts=dates.map((d,i)=>{ const e=entries.filter(z=>z.goal===goal&&z.primary&&z.date===d); return e.length?[x(i),y(Math.round(e.filter(z=>z.score==='ind').length/e.length*100)),e.length]:null; }).filter(Boolean);
    if(!pts.length) return;
    g+=`<polyline fill="none" stroke="${GOALS[goal].color}" stroke-width="4" stroke-dasharray="${dash[goal]}" stroke-linejoin="round" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
    pts.forEach(p=>{ g+=`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${GOALS[goal].color}" stroke="var(--surface)" stroke-width="2"><title>${GOALS[goal].short}: ${Math.round(100-(p[1]-T)/(H-T-B)*100)}% (${p[2]} trials)</title></circle>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Percent of trials independent per day, by goal">${g}</svg>
   <div class="legend">${[1,2,3].map(g=>`<span><i style="background:${GOALS[g].color}"></i>${GOALS[g].icon} ${GOALS[g].short}</span>`).join('')}<span>- - - 20% goal</span></div>`;
}

/* Saves a file. Inside the claude.ai viewer, plain download links are blocked, so use the
   platform's downloads capability there; when opened as a local file, use a normal link. */
let dlReady=null;
async function download(name,data,type){
  if(window.claude&&window.claude.use){
    dlReady=dlReady||window.claude.use('downloads').catch(()=>null);
    const dl=await dlReady;
    if(!dl){ toast('Saving files is not available here.'); return; }
    try{ await dl.save({filename:name,data:data instanceof Blob?data:new Blob([data],{type})}); toast('💾 Saved '+name); }
    catch(e){ if(e&&e.code==='declined') return; toast(e&&e.code==='rate_limited'?'Please wait a moment, then try again.':'Could not save the file.'); }
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function exportCSV(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['Student','Date','Time','Goal #','Goal','Activity','Video','Item','Score','Counts toward goal','Notes'];
  const lines=store.log.map(e=>[S.student,e.date,new Date(e.ts).toLocaleTimeString(),e.goal,GOALS[e.goal].short,e.type,e.act,e.item,SCORE[e.score].label,e.primary?'Yes':'Practice',e.detail].map(q).join(','));
  download(`${S.student.replace(/\W/g,'')}-IEP-data-${today()}.csv`,[head.map(q).join(','),...lines].join('\r\n'),'text/csv');
}
$('#restoreFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.log)) throw 0;
      if(!confirm(`Restore ${d.log.length} entries? This replaces the current data.`)) return;
      Object.assign(store,d); Object.assign(S,d.settings||{}); store.settings=S; save(); applySettings(); go('data'); toast('Backup restored'); }catch(err){ toast('That file is not a J.E. TV backup.'); } };
  r.readAsText(f); e.target.value='';
};

const THEMES=['dark','light','contrast'], THEME_L={dark:'DARK',light:'LIGHT',contrast:'HI-CON'};

function toggleSound(){ S.sound=!S.sound; if(!S.sound&&'speechSynthesis' in window) speechSynthesis.cancel(); save(); applySettings(); toast(S.sound?'🔊 Sound ON':'🔇 Sound OFF'); }
function toggleCC(){ S.captions=!S.captions; save(); applySettings(); toast(S.captions?'CC Captions ON':'Captions OFF'); }
function fullscreen(el){
  const d=document;
  if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); return; }
  const t=el||d.documentElement; (t.requestFullscreen||t.webkitRequestFullscreen||(()=>{})).call(t);
}
$('#tSound').onclick=toggleSound;
$('#tCC').onclick=toggleCC;
$('#tSize').onclick=()=>{ const i=SIZES.indexOf(S.scale); S.scale=SIZES[(i+1)%SIZES.length]; save(); applySettings(); };
